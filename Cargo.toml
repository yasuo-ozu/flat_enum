[package]
name = "flat_enum"
version = "0.2.0"
edition = "2021"
rust-version = "1.57"
description = "Expand nested enum into flattened enum"
license = "MIT"
keywords = ["macros"]
categories = ["data-structures"]
repository = "https://github.com/yasuo-ozu/flat_enum"

[features]
testing = []

[lib]
path = "lib.rs"

[dependencies]
flat_enum_macro = { path = "macro", version = "0.2.0" }
announce = "0.1.1"

[workspace]

members = ["macro", "testing", "testing/helper"]

resolver = "2"
