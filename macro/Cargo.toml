[package]
name = "flat_enum_macro"
version = "0.1.1"
edition = "2021"
rust-version = "1.57"
description = "Expand nested enum into flattened enum"
license = "MIT"
keywords = ["macros"]
categories = ["data-structures"]
repository = "https://github.com/yasuo-ozu/flat_enum"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
template-quote = "0.4"
announce = "0.1.0"

[dependencies.syn]
version = "2.0"
features = ["full", "derive", "printing", "extra-traits"]
